name: Deploy Homer to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard configuration
        uses: actions/checkout@v6

      - name: Download Homer
        run: |
          curl -fsSL \
            https://github.com/bastienwirtz/homer/releases/latest/download/homer.zip \
            -o /tmp/homer.zip
          mkdir -p _site
          unzip -q /tmp/homer.zip -d _site

      - name: Copy custom configuration
        run: |
          cp -R assets/. _site/assets/
          touch _site/.nojekyll
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
